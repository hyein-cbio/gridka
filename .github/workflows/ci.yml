name: CI

on:
  workflow_dispatch:  # 수동 실행 허용
    inputs:
      test_branch:
        description: 'Branch to test in this fork'
        required: true
        default: master
        type: string
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.test_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Manual runs use the requested branch; push/PR runs keep checkout's default ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.test_branch || '' }}
          persist-credentials: false

      - name: Show tested revision
        run: git show --no-patch --format='%H %s'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download DuckDB library
        run: bash Libraries/download-duckdb.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -scheme Gridka -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run tests
        run: |
          xcodebuild -scheme Gridka -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:GridkaTests \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO \
            test
